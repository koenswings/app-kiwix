app: kiwix
idea_app_version: "1.0"

compatibility:
  engine_min: "0.9.0"
  engine_tested: "unknown"

services:
  - name: kiwix
    build: retag
    upstream: kiwix/kiwix-serve
    upstream_tag: "3.3.0"
    image: koenswings/kiwix
    current_version: "1.0-3.3.0"
    notes: >
      Current compose.yaml uses unofficial image (grahamalderson/kiwix-serve).
      Migrate to official kiwix/kiwix-serve on next update.
    monitors:
      - kind: dockerhub
        repo: kiwix/kiwix-serve
        tag_pattern: "^\\d+\\.\\d+\\.\\d+$"

# Data approach: Approach 2 (content folder)
# ZIM files are mounted from ./data/ at runtime. Kit places chosen ZIM files
# in the content/ directory at App Disk build time. No copy-on-first-start needed.
# Source ZIM files stored on local data disk (Option III).
