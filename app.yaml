app: kiwix
idea_app_version: "1.0"

compatibility:
  engine_min: "0.9.0"
  engine_tested: "unknown"

services:
  - name: kiwix
    build: retag
    upstream: ghcr.io/kiwix/kiwix-serve
    upstream_tag: "3.8.2"
    image: koenswings/kiwix
    current_version: "1.0-3.8.2"
    notes: >
      1.0 compose.yaml uses the official multi-arch ghcr.io/kiwix/kiwix-serve:3.8.2
      directly (not yet retagged as koenswings/kiwix:1.0-3.8.2). It serves every
      *.zim in ./data via the image's start.sh shell glob (see compose.yaml).
    monitors:
      - kind: ghcr
        repo: kiwix/kiwix-serve
        tag_pattern: "^\\d+\\.\\d+\\.\\d+$"

# Data approach: Approach 2 (content folder)
# ZIM files are mounted from ./data/ at runtime. Kit places chosen ZIM files
# in the content/ directory at App Disk build time. No copy-on-first-start needed.
# Source ZIM files stored on local data disk (Option III).
