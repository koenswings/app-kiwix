x-app:
  name: kiwix
  title: Kiwix
  description: >
    Kiwix is an offline reader for web content such as Wikipedia, Wiktionary,
    Project Gutenberg and TED talks. It serves ZIM archives to any browser on
    the school network, with full-text search, without internet access.

    This app serves every *.zim file in the instance's data/ folder. Add or
    replace ZIM files there and restart the app.
  url: https://www.kiwix.org
  category: education
  icon: kiwix.png
  author: IDEA
  version: VERSION_PLACEHOLDER
  instanceName: kiwix

services:
  kiwix:
    # Official multi-arch (arm64) kiwix-serve. Not yet retagged as
    # koenswings/kiwix (see app.yaml). pull_policy never: the image must be
    # present on the Engine before start (docker pull ghcr.io/kiwix/kiwix-serve:3.8.2).
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    restart: no
    pull_policy: never
    # ZIM selection: the image entrypoint (start.sh) runs
    #   CMD="/usr/local/bin/kiwix-serve --port=$PORT $@"; $CMD
    # unquoted, with WORKDIR /data, so "*.zim" is glob-expanded by the shell
    # to every ZIM in /data. No file names are hard-coded: drop any ZIM into
    # data/ and restart. With no ZIM present kiwix-serve exits with an error
    # and start.sh lists /data in the log.
    command: ["*.zim"]
    volumes:
      - ./data:/data:ro
    ports:
      - ${port}:8080
