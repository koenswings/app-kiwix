x-app:
  name: kiwix
  title: Wikipedia
  description: >
    Kiwix is an offline reader for web content such as Wikipedia, Wiktionary,
    Project Gutenberg and TED talks. It serves ZIM archives to any browser on
    the school network, with full-text search, without internet access.

    This app serves every *.zim file in the instance's data/ folder. Add or
    replace ZIM files there and restart the app.
  url: https://www.kiwix.org
  category: education
  icon: kiwix.png
  author: IDEA
  version: 3b6a8a87df485dcd28e2a9eafb665bb4a29b3ba0
  instanceName: kiwix
  # Backups leave out the ZIM archives (agent-engine-dev#241; needs that Engine change, inert without it).
  # Paths are relative to the instance folder: ./data is mounted at /data and every data/*.zim is served.
  # ZIMs are re-obtainable (Kiwix library, a peer or a disk) and large (simple Wikipedia ~3 GB, full ~100+ GB).
  # Kept: everything else in data/ (e.g. the .zim.sha256 next to each ZIM), compose.yaml, .env.
  # A restored Kiwix has no ZIM and exits with "ERROR: no .zim file in /data" until one is put back.
  backup:
    exclude:
      - "data/*.zim"

services:
  kiwix:
    # Official multi-arch (arm64) kiwix-serve. Not yet retagged as
    # koenswings/kiwix (see app.yaml). pull_policy never: the image must be
    # present on the Engine before start (docker pull ghcr.io/kiwix/kiwix-serve:3.8.2).
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    restart: no
    pull_policy: never
    # ZIM selection: serve every *.zim in /data. compose passes exec-form
    # command args to start.sh without a shell, so a bare "*.zim" reaches
    # kiwix-serve literally (idea: app-kiwix 1.0 bug on wizardly-hugle).
    # Run our own shell instead: /bin/sh expands the glob, fails with a clear
    # error if there is no ZIM, and execs kiwix-serve under dumb-init.
    # ($$ is compose's escape for a literal $.)
    entrypoint: ["/usr/bin/dumb-init", "--", "/bin/sh", "-c"]
    command:
      - |
        set -- /data/*.zim
        if [ ! -f "$$1" ]; then
          echo "kiwix: ERROR: no .zim file in /data (the instance data/ folder). Add a ZIM file there and restart the app." >&2
          echo "kiwix: contents of /data:" >&2; ls -la /data >&2
          exit 1
        fi
        echo "kiwix: serving $$*"
        exec /usr/local/bin/kiwix-serve --port=8080 "$$@"
    volumes:
      - ./data:/data:ro
    ports:
      - ${port}:8080
