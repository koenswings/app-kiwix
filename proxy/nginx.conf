worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    # Daily file from the request timestamp (kit local time).
    map $time_iso8601 $log_ymd {
        "~^([0-9]{4}-[0-9]{2}-[0-9]{2})" $1;
        default unknown;
    }
    log_format usage_json escape=json
        '{"time":"$time_iso8601","addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status}';

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        access_log /logs/access-$log_ymd.json usage_json;

        location / {
            proxy_pass http://kiwix:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
